name: Daily Market Data Fetch

on:
  schedule:
    # 多组 cron 提升命中概率（GitHub 调度常被合并/延迟，故配合下方「自触发续跑」链）
    - cron: '3,23,43 1-8 * * 1-5'
    - cron: '13,33,53 1-8 * * 1-5'
    - cron: '0 9 * * 1-5'      # 17:00 北京，尾盘兜底锚点
    - cron: '30 8 * * 1-5'     # 16:30 北京，收盘前兜底锚点
  workflow_dispatch:
  repository_dispatch:
    types: [fetch-data]

permissions:
  contents: write

# 防止重叠运行：同组新运行排队，避免并发写 api/data.json 互相覆盖
concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install akshare tushare jqdatasdk -q

      - name: Fetch data (失败自动重试 x3)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          JQ_USER: ${{ secrets.JQ_USER }}
          JQ_PASSWORD: ${{ secrets.JQ_PASSWORD }}
        run: |
          for i in 1 2 3; do
            python fetch_data.py && break
            echo "⚠️ 第 $i 次抓取失败，10s 后重试"
            sleep 10
          done

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://xiaoliu-bot:${{ secrets.GH_PAT }}@github.com/xiaoliu-bot/white-dashbord.git

      - name: Commit and push
        run: |
          # 检查是否有变化（不依赖退出码，避免 set -e 问题）
          CHANGES=$(git status --porcelain api/data.json api/history/)
          if [ -n "$CHANGES" ]; then
            DATE=$(date '+%Y-%m-%d')
            TS=$(date '+%H:%M')
            git add api/data.json api/history/
            git commit -m "📊 数据快照 $DATE $TS"
            git push
            echo "✅ 推送成功"
          else
            echo "无变化，跳过推送"
          fi

      - name: Self-redispatch（交易时段每 15 分钟续跑）
        # 弥补 GitHub 自带 cron 在盘中几乎不触发的问题：一旦被外部/手动/定时踢起，
        # 在 08:00–20:00 北京时间内每 15 分钟自触发下一轮，保证盘中高频刷新；
        # 窗口放宽到 20:00 以接住被 GitHub 延迟到盘后的「启动运行」，避免当天完全不刷新。
        if: success()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          H=$(TZ=Asia/Shanghai date +%H); M=$(TZ=Asia/Shanghai date +%M)
          HHMM=$((10#$H * 60 + 10#$M))
          DOW=$(TZ=Asia/Shanghai date +%u)
          if [ "$DOW" -le 5 ] && [ "$HHMM" -ge 480 ] && [ "$HHMM" -le 1200 ]; then
            echo "交易时段内（含盘后兜底窗口），约 15 分钟后自触发下一轮"
            sleep 885
            curl -s -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/xiaoliu-bot/white-dashbord/actions/workflows/317447721/dispatches" \
              -d '{"event_type":"fetch-data"}'
          else
            echo "非交易时段，停止自触发"
          fi
